name: Deploy Channel Stream

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  # ── Job 1: Backend ────────────────────────────────────────────────────────────
  deploy-backend:
    name: Backend → ECR + ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/channel-stream-backend
          TAG:   ${{ github.sha }}
        run: |
          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster channel-stream \
            --service channel-stream-backend \
            --force-new-deployment

  # ── Job 2: Frontend ───────────────────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_BASE_PATH:         /channel-stream
          NEXT_PUBLIC_API_URL:           https://api.jonathanlohr.com
          NEXT_PUBLIC_COGNITO_DOMAIN:    https://channel-stream-jl.auth.us-east-1.amazoncognito.com
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 1bsck4p8ma568p0pj8rk4gkug9
          NEXT_PUBLIC_REDIRECT_URI:      https://jonathanlohr.com/channel-stream/auth/callback
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.PORTFOLIO_S3_BUCKET }}/channel-stream/ \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 sync out/ s3://${{ secrets.PORTFOLIO_S3_BUCKET }}/channel-stream/ \
            --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PORTFOLIO_CF_ID }} \
            --paths "/channel-stream/*"
